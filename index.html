<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAL</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>

    <nav>
        <h1 class="brand-name">YourAniList</h1>
        <ul>
            <li>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>

                    <input type="search" id="animeSearch" placeholder="Search anime...">
                </div>
            </li>
            <li><button id="completedLink" class="active" type="button" aria-pressed="true">

                </button>
            </li>
            <li><button id="planningLink" type="button" aria-pressed="false">
                    Planning
                </button>
            </li>
        </ul>
    </nav>

    <main id="animeGrid"></main>

    <script type="module" src="src/main.js"></script>

</body>

</html>
