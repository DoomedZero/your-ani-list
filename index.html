<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F7F4">
    <meta name="description" content="A minimal corner of internet to explore my anime list and solve the backlog, one story at a time.">
    <title>YAL — YourAniList</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <script type="module" src="src/main.js"></script>
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <a href="#home" class="brand-name" data-view="home">YourAniList</a>
            <ul class="nav-links">
                <li><a href="#list" class="nav-link" data-view="list">My List</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="homeView" class="view">
            <section class="hero">
                <div class="hero-copy">
                    <h1>Anime backlog solver &nbsp; ^-^</h1>
                    <p class="hero-description">Complete your anime backlogs in this minimal corner of internet</p>
                    <div class="hero-actions">
                        <a href="#list" class="button button-primary" data-view="list" data-status="COMPLETED">Explore my list</a>
                        <button type="button" class="button button-secondary" id="pickNextButton">Solve Backlog!</button>
                    </div>
                </div>
                <div class="hero-art" aria-hidden="true">
                    <div class="sun"></div>
                    <div class="mountain mountain-back"></div>
                    <div class="mountain mountain-front"></div>
                    <div class="city">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </section>

            <section id="nextPick" class="next-pick" hidden aria-live="polite">
                <div>
                    <h2 id="pickTitle">Your next anime</h2>
                    <p id="pickMessage" class="pick-message"></p>
                    <!-- This is a bloat, I would like to remove -->
                    <button type="button" class="text-button" id="pickAgainButton">Pick another ↻</button>
                </div>
                <img id="pickCover" src="" alt="">
            </section>
        </section>

        <section id="listView" class="view" hidden>
            <div class="list-heading">
                <div>
                    <h1 id="listTitle">Completed</h1>
                </div>
                <label class="search-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                    <input type="search" id="animeSearch" placeholder="Search anime..." autocomplete="off">
                </label>
            </div>

            <div class="status-tabs" role="group" aria-label="Anime list status">
                <button class="status-tab active" type="button" data-status="COMPLETED" aria-pressed="true">Completed</button>
                <button class="status-tab" type="button" data-status="PLANNING" aria-pressed="false">Planning</button>
                <button class="status-tab" type="button" data-status="DROPPED" aria-pressed="false">Dropped</button>
            </div>

            <p id="listStatus" class="list-status" role="status" aria-live="polite">Loading your collection...</p>
            <div id="animeGrid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <a href="https://github.com/DoomedZero/your-ani-list" target="_blank" rel="noopener noreferrer">View source on GitHub ↗</a>
    </footer>
</body>
</html>
